name: Secret Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  secret-scan:
    name: Detect Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Run secret scan
        id: scan
        run: |
          # Scan all files except baseline and results
          detect-secrets scan \
            --exclude-files '\.secrets\.baseline' \
            --exclude-files 'aegis_eval/results/' \
            --exclude-files '\.venv/' \
            --exclude-files 'aegis_kg/schema/00_setup_neo4j\.sh' \
            --exclude-files 'docker-compose\.yml' \
            --force-use-all-plugins \
            2>&1 | tee /tmp/scan_output.json

          # Parse results
          python3 << 'PYEOF'
          import json
          import sys

          try:
            with open('/tmp/scan_output.json') as f:
              content = f.read()
              # Find JSON start
              start = content.find('{')
              if start >= 0:
                data = json.loads(content[start:])
              else:
                print("No JSON found in output")
                sys.exit(0)

            results = data.get('results', {})
            total = sum(len(v) for v in results.values())

            if total > 0:
              print(f"\n::error::BLOCKED: {total} secret(s) detected!")
              print("")
              for filename, secrets in results.items():
                for s in secrets:
                  print(f"  {filename}:{s.get('line_number', '?')} — {s.get('type', 'Unknown')}")
              sys.exit(1)
            else:
              print("OK: No secrets detected.")
              sys.exit(0)
          except Exception as e:
            print(f"Warning: Could not parse scan output: {e}")
            sys.exit(0)
          PYEOF

          SCAN_RESULT=$?

          if [ $SCAN_RESULT -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "SECRET SCAN FAILED: Secrets detected in code"
            echo "=========================================="
            echo ""
            echo "Possible causes:"
            echo "  1. A real secret was committed (check the file(s) above)"
            echo "  2. A new pattern needs to be added to detect-secrets"
            echo ""
            echo "If this is a false positive in MEMORY.md or another file:"
            echo "  1. Remove the secret from the file"
            echo "  2. Document it in your .env file instead"
            echo "  3. Re-commit"
            echo ""
            exit 1
          fi

          exit $SCAN_RESULT
